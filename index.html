<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0a1612">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Poker Club">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Gerenciador de torneios de poquer para clubes e mesas casuais.">
  <title>Poker Club</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="loginGate" class="login-gate" hidden></div>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="chip-mark" aria-hidden="true"></span>
        <div>
          <h1 id="pageTitle">Poker Club</h1>
          <p id="pageSubtitle">Torneios</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="syncDot" class="sync-dot" title="Local"></span>
        <button class="icon-btn" id="btnBackup" type="button" aria-label="Conta e backup">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        </button>
      </div>
    </header>
    <main id="view" class="view"></main>
    <nav class="tabbar" aria-label="Navegação">
      <button class="tab active" data-view="dashboard" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20H4z"/></svg>
        <span>Início</span>
      </button>
      <button class="tab" data-view="players" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/><path d="M4 20a8 8 0 0116 0"/></svg>
        <span>Jogadores</span>
      </button>
      <button class="tab" data-view="tournaments" type="button">
        <svg viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 01-10 0V4z"/><path d="M12 12v4"/><path d="M8 20h8"/></svg>
        <span>Torneios</span>
      </button>
      <button class="tab" data-view="timer" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 3h6"/></svg>
        <span>Relógio</span>
      </button>
      <button class="tab admin-only" data-view="cash" type="button">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1.4"/></svg>
        <span>Caixa</span>
      </button>
      <button class="tab" data-view="cashpot" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M8 7V5h8v2"/><path d="M8 12h8"/></svg>
        <span>Cash Pot</span>
      </button>
      <button class="tab" data-view="champions" type="button">
        <svg viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 01-10 0V4z"/><path d="M7 7H4a3 3 0 003 3"/><path d="M17 7h3a3 3 0 01-3 3"/><path d="M9 20h6"/></svg>
        <span>Campeões</span>
      </button>
    </nav>
  </div>
  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="alertOverlay" class="alert-overlay" hidden>
    <div class="alert-box">
      <p id="alertTitle">FIM DA RODADA</p>
      <p id="alertSub">BLINDS SERÃO AUMENTADOS</p>
      <div id="alertBlinds" class="blinds"></div>
      <button type="button" id="alertClock">CRONÔMETRO</button>
      <button type="button" id="alertNext" hidden>Iniciar próxima rodada</button>
    </div>
  </div>
  <div id="presentStage" class="present-stage" hidden>
    <button type="button" id="presentExit" class="present-exit" aria-label="Minimizar tela">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v5H3"/><path d="M16 3v5h5"/><path d="M8 21v-5H3"/><path d="M16 21v-5h5"/></svg>
    </button>
    <div id="presentTime" class="present-time">10:00</div>
    <p id="presentAudioHint" class="present-audio-hint" hidden>Toque na tela para ativar o som</p>
    <div class="present-controls">
      <button type="button" class="btn primary" id="presentStart">INICIAR</button>
      <button type="button" class="btn" id="presentPause">PAUSAR</button>
      <button type="button" class="btn" id="presentReset">RESET</button>
      <button type="button" class="btn adj-time" id="presentPlus">+1 MIN</button>
      <button type="button" class="btn adj-time" id="presentMinus">-1 MIN</button>
      <button type="button" class="btn adj-time" id="presentPlus10">+10 SEG</button>
      <button type="button" class="btn adj-time" id="presentMinus10">-10 SEG</button>
      <div class="clock-minutes-row present-minutes-row">
        <input class="clock-minutes-input" id="presentMinutes" type="number" inputmode="numeric" min="1" max="180" step="1" placeholder="30" aria-label="Minutos">
        <span class="clock-minutes-label">minutos</span>
        <button type="button" class="btn primary" id="presentApply">APLICAR</button>
      </div>
    </div>
  </div>
  <script src="js/supabase-config.js?v=31"></script>
  <script src="js/store.js?v=31"></script>
  <script src="js/cloud.js?v=31"></script>
  <script src="js/app.js?v=31"></script>
</body>
</html>
